# Baut die Desktop-App für Windows, macOS und Linux.
#
# - Von Hand starten (Actions › Desktop-Pakete › Run workflow): Die Pakete
#   liegen danach als Artefakte am Workflow-Lauf.
# - Tag „vX.Y.Z“ pushen: Zusätzlich entsteht ein Release-Entwurf mit allen
#   Paketen, der auf GitHub nur noch veröffentlicht werden muss.
name: Desktop-Pakete

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS (Intel und Apple Silicon)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            # Älteres Ubuntu: Die Pakete laufen dann auch auf älteren Distributionen.
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/autocell/src-tauri -> target

      - run: npm ci
      - run: npm test

      - name: Version aus package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob Tag und Version zusammenpassen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version ${{ steps.version.outputs.version }} in package.json"
            exit 1
          fi

      - name: Bauen (und bei Tags: Release-Entwurf)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/autocell
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: AutoCell ${{ steps.version.outputs.version }}
          releaseBody: |
            Installationspakete für AutoCell ${{ steps.version.outputs.version }}. Die Änderungen stehen im [Änderungsprotokoll](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            - **Windows:** `AutoCell_…_x64-setup.exe`
            - **macOS:** `AutoCell_…_universal.dmg` (Intel und Apple Silicon). Die App ist nicht von Apple beglaubigt: beim ersten Start im Finder mit Rechtsklick › Öffnen starten.
            - **Linux:** `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) oder `.AppImage` (alle Distributionen, nach dem Herunterladen ausführbar machen)

            Ohne Installation: die Web-Version unter https://delbonum.github.io/autocell/
          releaseDraft: true
          prerelease: false

      - name: Pakete als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: AutoCell-${{ steps.version.outputs.version }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/autocell/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/autocell/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/autocell/src-tauri/target/**/release/bundle/deb/*.deb
            apps/autocell/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/autocell/src-tauri/target/**/release/bundle/appimage/*.AppImage
