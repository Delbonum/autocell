[package]
name = "autocell"
version = "2.1.0"
description = "AutoCell – Simulation zellulärer Automaten (Desktop-Hülle)"
edition = "2021"
publish = false

[lib]
name = "autocell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
